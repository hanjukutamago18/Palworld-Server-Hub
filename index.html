<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palworld Server Hub - Platform Publik</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #120e1c;
            --bg-card: #181324;
            --border-color: #2b223d;
            --text-main: #e0e0e0;
            --text-muted: #8b839c;
            --accent-green: #a3ff47;
            --accent-pink: #ff2a7a;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 900px; width: 100%; }
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        h1 { margin: 0; color: #fff; font-size: 1.8em; }
        h2 { font-size: 0.9em; color: var(--accent-green); text-transform: uppercase; letter-spacing: 2px; margin-top: 0; }
        
        .btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { opacity: 0.85; }
        .btn-pink { background: var(--accent-pink); color: #fff; }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            background: #100c17;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }

        label { font-size: 0.85em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .server-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .server-item:last-child { border-bottom: none; }
        
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header & Navigasi Auth -->
        <div class="card flex-between">
            <div>
                <h2>Palworld Community Platform</h2>
                <h1>Daftar Server Publik</h1>
            </div>
            <div id="auth-section">
                <!-- Tombol Login/Logout akan diatur otomatis via JS -->
                <button class="btn" onclick="openLoginModal()">Login / Register</button>
            </div>
        </div>

        <!-- Daftar Server Publik yang Sudah Terdaftar -->
        <div class="card">
            <h2>Server yang Aktif</h2>
            <div id="server-list">Memuat daftar server...</div>
        </div>

        <!-- Form Tambah Server (Hanya muncul jika sudah login) -->
        <div class="card hidden" id="register-card">
            <h2>Daftarkan Server Kamu</h2>
            <form id="server-form" onsubmit="registerServer(event)">
                <label>Nama Server</label>
                <input type="text" id="srv-name" placeholder="Contoh: Esther Sunny Yolk" required>
                
                <label>IP Address & Port Game</label>
                <input type="text" id="srv-ip" placeholder="Contoh: 15.235.180.31:28029" required>
                
                <label>Port REST API</label>
                <input type="text" id="srv-api" placeholder="Contoh: 28045" required>

                <label>Password Admin (RCON/API)</label>
                <input type="password" id="srv-pass" placeholder="Password admin server kamu" required>

                <label>Slug URL Unik (untuk halaman khusus)</label>
                <input type="text" id="srv-slug" placeholder="contoh: esther-sunny" required>

                <button type="submit" class="btn btn-pink">Simpan & Daftarkan Server</button>
            </form>
        </div>

        <!-- Modal Login Sederhana -->
        <div class="card hidden" id="login-card">
            <h2>Autentikasi Pengguna</h2>
            <p style="color: var(--text-muted); font-size: 0.9em;">Masukkan email kamu untuk masuk atau mendaftar otomatis ke platform.</p>
            <label>Email</label>
            <input type="email" id="auth-email" placeholder="emailkamu@domain.com">
            <button class="btn" onclick="handleLogin()">Kirim Link Login (Magic Link)</button>
            <button class="btn" style="background:transparent; color:var(--text-muted);" onclick="closeLoginModal()">Batal</button>
        </div>
    </div>

    <script>
        // Konfigurasi Supabase menggunakan variabel publik Vercel
        // Pastikan SUPABASE_URL dan SUPABASE_ANON_KEY sudah diset di Environment Variables Vercel
        const SUPABASE_URL = "https://cewjmzsyxtqqefhvllvf.supabase.co/"; 
        const SUPABASE_ANON_KEY = "sb_publishable_7Wfw8fIUWSS7AZ8Msk3ruw_Ek96AnQn";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            currentUser = session ? session.user : null;
            updateAuthUI();
            fetchServers();

            supabaseClient.auth.onAuthStateChange((event, session) => {
                currentUser = session ? session.user : null;
                updateAuthUI();
            });
        }

        function updateAuthUI() {
            const authSection = document.getElementById('auth-section');
            const registerCard = document.getElementById('register-card');

            if (currentUser) {
                authSection.innerHTML = `
                    <span style="font-size: 0.9em; margin-right: 15px; color: var(--text-muted);">${currentUser.email}</span>
                    <button class="btn btn-pink" onclick="handleLogout()">Logout</button>
                `;
                registerCard.classList.remove('hidden');
            } else {
                authSection.innerHTML = `<button class="btn" onclick="openLoginModal()">Login / Register</button>`;
                registerCard.classList.add('hidden');
            }
        }

        function openLoginModal() {
            document.getElementById('login-card').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('login-card').classList.add('hidden');
        }

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            if (!email) return alert('Masukkan email terlebih dahulu!');
            
            const { error } = await supabaseClient.auth.signInWithOtp({ email });
            if (error) {
                alert('Gagal mengirim login: ' + error.message);
            } else {
                alert('Tautan login telah dikirim ke email kamu! Silakan cek inbox/spam.');
                closeLoginModal();
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        async function fetchServers() {
            const listDiv = document.getElementById('server-list');
            const { data, error } = await supabaseClient.from('servers').select('*');

            if (error) {
                listDiv.innerHTML = `<span style="color: var(--accent-pink);">Gagal memuat data server.</span>`;
                return;
            }

            if (!data || data.length === 0) {
                listDiv.innerHTML = `<span style="color: var(--text-muted);">Belum ada server yang terdaftar. Jadilah yang pertama!</span>`;
                return;
            }

            listDiv.innerHTML = data.map(srv => `
                <div class="server-item">
                    <div>
                        <strong style="color: #fff; font-size: 1.1em;">${srv.name}</strong><br>
                        <span style="font-size: 0.85em; color: var(--text-muted);">IP: ${srv.ip} | Slug: /${srv.slug}</span>
                    </div>
                    <a href="/server/${srv.slug}" class="btn" style="font-size: 0.8em; padding: 6px 12px;">Lihat Status</a>
                </div>
            `).join('');
        }

        async function registerServer(e) {
            e.preventDefault();
            if (!currentUser) return alert('Kamu harus login terlebih dahulu!');

            const name = document.getElementById('srv-name').value;
            const ip = document.getElementById('srv-ip').value;
            const api_port = document.getElementById('srv-api').value;
            const admin_password = document.getElementById('srv-pass').value;
            const slug = document.getElementById('srv-slug').value;

            const { error } = await supabaseClient.from('servers').insert([
                { name, ip, api_port, admin_password, slug, user_id: currentUser.id }
            ]);

            if (error) {
                alert('Gagal mendaftarkan server: ' + error.message);
            } else {
                alert('Berhasil mendaftarkan server!');
                document.getElementById('server-form').reset();
                fetchServers();
            }
        }

        init();
    </script>
</body>
</html>
